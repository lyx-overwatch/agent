# ============================================================================
# Provisioner RBAC — 创建/删除 Sandbox Pod & Service 的权限
# 注意：namespace 用 fintech-aigc-dev，与现有服务保持一致
# 如需运维在 CCE 控制台创建，见文末注释
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skillhub-provisioner
  namespace: fintech-aigc-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skillhub-provisioner
  namespace: fintech-aigc-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skillhub-provisioner
  namespace: fintech-aigc-dev
subjects:
  - kind: ServiceAccount
    name: skillhub-provisioner
    namespace: fintech-aigc-dev
roleRef:
  kind: Role
  name: skillhub-provisioner
  apiGroup: rbac.authorization.k8s.io

---
# ============================================================================
# ClusterRole — 集群级资源（namespaces 和 nodes 必须在集群级别授权）
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skillhub-provisioner-cluster
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skillhub-provisioner-cluster
subjects:
  - kind: ServiceAccount
    name: skillhub-provisioner
    namespace: fintech-aigc-dev
roleRef:
  kind: ClusterRole
  name: skillhub-provisioner-cluster
  apiGroup: rbac.authorization.k8s.io

# ── 在 CCE 控制台创建（如果不便用 kubectl）─────────────────────────────────
# "权限管理" → ServiceAccount: skillhub-provisioner / 命名空间: fintech-aigc-dev
# "权限管理" → Role: 同上，规则见 spec.rules
# "权限管理" → RoleBinding: 同上