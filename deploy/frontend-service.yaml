# ============================================================================
# SkillHub 前端 Service (ClusterIP)
# ============================================================================
# 集群内 DNS: skillhub-frontend.fintech-aigc-dev.svc.cluster.local
# Service 端口: 80 → 容器 80（nginx 默认端口）
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: skillhub-frontend
  namespace: fintech-aigc-dev
  labels:
    app: skillhub-frontend
    version: v1
spec:
  type: ClusterIP
  selector:
    app: skillhub-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP