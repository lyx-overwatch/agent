# ============================================================================
# Provisioner Service (ClusterIP)
# ============================================================================
# DNS: sandbox-provisioner.fintech-aigc-dev.svc.cluster.local
# 主后端通过 PROVISIONER_URL=http://sandbox-provisioner:8002 调用
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: sandbox-provisioner
  namespace: fintech-aigc-dev
  labels:
    app: sandbox-provisioner
    version: v1
spec:
  type: ClusterIP
  selector:
    app: sandbox-provisioner
  ports:
    - name: http
      port: 8002
      targetPort: 8002
      protocol: TCP