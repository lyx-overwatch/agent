# ============================================================================
# SkillHub 主后端 Deployment
# ============================================================================
# 镜像: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/skillhub-backend:20260811V1.0
# 容器端口: 8001 (FastAPI uvicorn)
#
# 依赖:
#   - Secret: skillhub-backend-env（从 .env.production.test 创建）
#     kubectl create secret generic skillhub-backend-env \
#       --from-env-file=.env.production.test \
#       -n fintech-aigc-dev
#
# 只改单个密钥（不重建整个 Secret）：kubectl patch + stringData。
# stringData 是「只写」字段——patch 时自动 base64 后合并进 data，
# 只覆盖指定的 key，其余 key 不动。
#     kubectl patch secret skillhub-backend-env -n fintech-aigc-dev \
#       -p '{"stringData":{"<KEY>":"<VALUE>"}}'
#     例（改 S3 地址）：
#     kubectl patch secret skillhub-backend-env -n fintech-aigc-dev \
#       -p '{"stringData":{"S3_ENDPOINT":"https://obs.cn-south-1.myhuaweicloud.com"}}'
#
# ⚠️ 无论重建还是 patch，都要重启 Deployment 才生效——
#    envFrom 只在 Pod 启动时读取一次，运行中的 Pod 不会自动刷新：
#     kubectl rollout restart deployment/skillhub-backend -n fintech-aigc-dev
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillhub-backend
  namespace: fintech-aigc-dev
  labels:
    app: skillhub-backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillhub-backend
  template:
    metadata:
      labels:
        app: skillhub-backend
        version: v1
    spec:
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: default-secret
      # ── 数据库迁移 ───────────────────────────────────────────────────
      # 迁移已合并进主容器启动流程（Dockerfile CMD：先 alembic upgrade head
      # 再启动 uvicorn），不再用 initContainer，发布只需改一处镜像 tag。
      # 迁移失败则容器退出、K8s 自动重启重试，等价于原 initContainer 语义。
      # 注意：全新数据库仍需先跑 init-db-job.yaml（从零建表 + stamp head）。
      containers:
        - name: backend
          image: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/skillhub-backend:20260824V2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          envFrom:
            - secretRef:
                name: skillhub-backend-env
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
