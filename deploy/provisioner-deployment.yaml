# ============================================================================
# Provisioner Deployment
# ============================================================================
# 镜像: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/sandbox-provisioner:20260811V1.0
# 容器端口: 8002
# ServiceAccount: skillhub-provisioner（K8s Pod/Service CRUD 权限）
#
# Sandbox Pod 也创建在 fintech-aigc-dev namespace
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-provisioner
  namespace: fintech-aigc-dev
  labels:
    app: sandbox-provisioner
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-provisioner
  template:
    metadata:
      labels:
        app: sandbox-provisioner
        version: v1
    spec:
      serviceAccountName: skillhub-provisioner
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: provisioner
          image: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/sandbox-provisioner:20260817V1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: K8S_NAMESPACE
              value: fintech-aigc-dev
            - name: SANDBOX_IMAGE
              value: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/docker-sandbox:20260813V1.0
            # 常驻 Pod 池预热数量：与 backend config.yaml 的 sandbox.pool.size 保持一致
            # (config.yaml 默认 size: 3)。provisioner 启动时异步预热 pool-0 … pool-N-1。
            - name: SANDBOX_POOL_SIZE
              value: '3'
            # 节点固定策略：集群节点弹性伸缩、节点名会变，且普通账号无权改 Node，
            # 所以「按节点名固定」不可行。正确锚点是「节点池标签」，需管理员在节点池上
            # 打 skillhub.io/sandbox-node=true 标签后，改成：
            #   SANDBOX_NODE_LABEL_KEY   = skillhub.io/sandbox-node
            #   SANDBOX_NODE_LABEL_VALUE = "true"
            # 拿到标签前先留空（空 = 不限制调度，维持现状）。
            - name: SANDBOX_NODE_LABEL_KEY
              value: ''
            - name: SANDBOX_NODE_LABEL_VALUE
              value: 'true'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 30
