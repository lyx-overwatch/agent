# ============================================================================
# SkillHub 数据库初始化 Job（全新数据库用）
# ============================================================================
# 用途: 全新数据库一键建表。从当前 SQLModel 模型生成所有表结构，
#       然后 stamp alembic 到 head，后续即可正常使用增量迁移。
#
# 与 migration-job.yaml 的区别:
#   - init:   从零建表（全新安装用）
#   - migrate: 增量迁移（已有库升级用）
#
# 使用方式:
#   kubectl delete job skillhub-db-init -n fintech-aigc-dev --ignore-not-found
#   kubectl apply -f deploy/init-db-job.yaml
#   kubectl logs -f job/skillhub-db-init -n fintech-aigc-dev
#
# 执行一次即可，后续升级用 migration-job.yaml。
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: skillhub-db-init
  namespace: fintech-aigc-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: init
          image: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/skillhub-backend:20260812V4.0
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              echo "=== Initializing database from SQLModel metadata ==="
              cd /app

              echo "--- Step 1: Drop old business tables (if any) ---"
              python -c "
              import asyncio, sys
              from app.models.database import engine
              from sqlmodel import SQLModel
              from app.models.database import User, UserSkill, Run, Message

              async def drop_all():
                  async with engine.begin() as conn:
                      await conn.run_sync(lambda sync_conn: (
                          SQLModel.metadata.drop_all(sync_conn, tables=[User.__table__, UserSkill.__table__, Run.__table__, Message.__table__])
                      ))
                  print('Old tables dropped (if existed).')

              asyncio.run(drop_all())
              "

              echo "--- Step 2: Create tables from current model definitions ---"
              python -c "
              import asyncio
              from app.models.database import engine
              from sqlmodel import SQLModel

              async def create_all():
                  async with engine.begin() as conn:
                      await conn.run_sync(SQLModel.metadata.create_all)
                  print('Tables created from SQLModel metadata.')

              asyncio.run(create_all())
              "

              echo "--- Step 3: Stamp alembic to head ---"
              python -m alembic -c /app/alembic.ini stamp head

              echo "--- Step 4: Verify ---"
              python -c "
              import asyncio
              from sqlalchemy import text
              from app.models.database import engine

              async def verify():
                  async with engine.connect() as conn:
                      result = await conn.execute(text(
                          \"SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' ORDER BY table_name\"
                      ))
                      tables = [row[0] for row in result]
                      print(f'Tables found: {tables}')
                      expected = {'users', 'user_skills', 'runs', 'messages'}
                      missing = expected - set(tables)
                      if missing:
                          print(f'MISSING: {missing}')
                          sys.exit(1)
                      print('All expected tables present.')

              asyncio.run(verify())
              " || { echo "!!! Verification failed !!!"; exit 1; }

              echo "=== Database initialization completed ==="
              echo "Sleeping 10s so you can grab logs..."
              sleep 10
          envFrom:
            - secretRef:
                name: skillhub-backend-env
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
