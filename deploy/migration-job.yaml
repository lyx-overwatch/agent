# ============================================================================
# SkillHub 数据库迁移 Job（已废弃，保留作手动回退用）
# ============================================================================
# ⚠️ 增量迁移已改为自动：backend-deployment.yaml 里的 initContainer
#   （db-migrate）会在主容器启动前自动 alembic upgrade head，无需手动跑本 Job。
#   本文件仅在需要「脱离发布、单独手动迁移」时作为回退手段保留。
#
# 用途: 手动执行 alembic upgrade head，创建/更新数据库表
#
# 使用方式:
#   kubectl delete job skillhub-db-migrate -n fintech-aigc-dev --ignore-not-found
#   kubectl apply -f deploy/migration-job.yaml
#   kubectl logs -f job/skillhub-db-migrate -n fintech-aigc-dev
#
# 注意：本 Job 的镜像 tag 需手动同步为含目标迁移的版本。
# ============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: skillhub-db-migrate
  namespace: fintech-aigc-dev
spec:
  ttlSecondsAfterFinished: 3600  # 1 小时后自动清理
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: migrate
          image: swr.cn-south-1.myhuaweicloud.com/fintech-aigc/skillhub-backend:20260812V4.0
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - |
              echo "=== Running database migrations ==="
              echo "--- Checking files ---"
              ls -la /app/alembic.ini
              ls -la /app/migrations/
              echo "--- Running migration ---"
              cd /app && python -m alembic -c /app/alembic.ini upgrade head
              MIGRATION_EXIT_CODE=$?
              echo "--- Migration exit code: $MIGRATION_EXIT_CODE ---"
              echo "=== Migrations completed ==="
              echo "Sleeping 10s so you can grab logs..."
              sleep 10
          envFrom:
            - secretRef:
                name: skillhub-backend-env
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
