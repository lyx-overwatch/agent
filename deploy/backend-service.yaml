# ============================================================================
# SkillHub 主后端 Service (ClusterIP)
# ============================================================================
# 集群内 DNS: skillhub-backend.fintech-aigc-dev.svc.cluster.local
# Service 端口: 80 → 容器 8001（与现有 aigc-* 服务规范一致）
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: skillhub-backend
  namespace: fintech-aigc-dev
  labels:
    app: skillhub-backend
    version: v1
spec:
  type: ClusterIP
  selector:
    app: skillhub-backend
  ports:
    - name: http
      port: 80
      targetPort: 8001
      protocol: TCP