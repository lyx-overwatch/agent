[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk"
version = "0.1.0"
description = "Feature-rich + brand-neutral agent runtime SDK (extracted from DeerFlow)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    { name = "DeerFlow Contributors" },
]
keywords = [
    "agent",
    "ai",
    "langgraph",
    "sandbox",
    "mcp",
    "skills",
]

# Minimal runtime dependencies (the SDK re-implements the
# langchain/langgraph agent loop; only the parts that appear in
# the public surface need to be installed).  Extras such as MCP
# adapters, web tools, and sandbox backends live in
# ``project.optional-dependencies``.
dependencies = [
    "langchain>=0.6",
    "langgraph>=0.6",
    "pydantic>=2.0",
    "langchain-deepseek>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.optional-dependencies]
# 可选 extras: 按需启用
sandbox-aio = ["agent-sandbox>=0.0.30"]
mcp = ["langchain-mcp-adapters>=0.1.0"]
# web-tools = ["exa-py", "firecrawl-py", "tavily-python", "ddgs", "jina-reader"]

[tool.hatch.build.targets.wheel]
packages = ["agent_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "agent_sdk",
    "README.md",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
