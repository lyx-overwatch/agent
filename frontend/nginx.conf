# SkillHub 前端 nginx 配置
# debug-agent.html 走 SPA-style fallback：所有路径都返回 index.html。
# 这样 /chat、/skills 这种清爽路径也能用（虽然当前前端没有路由逻辑，
# 但未来加 router 时不用改 nginx）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源直接返回；找不到则回退到 index.html（兼容未来前端路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 不缓存 index.html —— 前端迭代频繁，避免部署后用户看到旧版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # CDN 资源在本机走 cache（marked / fontawesome 走的是 jsdelivr CDN，
    # 这里只是 nginx 端缓存逻辑，CDN 自己的缓存由它们控制）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;
}