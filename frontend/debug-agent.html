      // ═══════════════════════ SKILLS (PR4) ═══════════════════════
      let skillsTab = 'mine'; // 'mine' | 'market' | 'review'
      let currentRole = 'user'; // 当前用户角色，来自 /auth/verify

      function authHeaders() {
        // 不带 Content-Type（供 multipart 上传使用，浏览器自动补 boundary）
        const h = {};
        const t = token();
        if (t) h['Authorization'] = `Bearer ${t}`;
        return h;
      }

      function skillStatusMeta(status) {
        const map = {
          draft: { label: '草稿', cls: 'draft' },
          pending: { label: '待审核', cls: 'pending' },
          approved: { label: '已通过', cls: 'approved' },
          rejected: { label: '已拒绝', cls: 'rejected' },
        };
        return map[status] || { label: status || '未知', cls: 'draft' };
      }

      function showSkills(tab) {
        skillsTab = tab || skillsTab || 'mine';
        // 清空会话状态，避免技能面板被追加到历史对话下方
        newConversation();
        const w = $('messages').querySelector('.msg.welcome');
        if (w) w.remove();

        const container = document.createElement('div');
        container.className = 'msg system';
        container.style.maxWidth = '100%';
        container.innerHTML = `
          <div class="skills-panel">
            <div class="skills-tabs">
              <button class="skills-tab ${skillsTab === 'mine' ? 'active' : ''}" onclick="showSkills('mine')">🛠️ 我的技能</button>
              <button class="skills-tab ${skillsTab === 'market' ? 'active' : ''}" onclick="showSkills('market')">🏪 技能广场</button>
              ${currentRole === 'admin' ? `<button class="skills-tab ${skillsTab === 'review' ? 'active' : ''}" onclick="showSkills('review')">🔍 审核</button>` : ''}
            </div>
            <div class="skills-body" id="skillsBody">
              <div class="skills-loading">加载中...</div>
            </div>
          </div>
        `;
        $('messages').appendChild(container);
        $('messages').scrollTop = $('messages').scrollHeight;
        $('input-area').classList.add('hidden');
        refreshSkillsBody();
      }

      function refreshSkillsBody() {
        if (skillsTab === 'market') return renderMarketplace();
        if (skillsTab === 'review') return renderReviewQueue();
        return renderMySkills();
      }

      async function renderMySkills() {
        const body = $('skillsBody');
        if (!body) return;
        body.innerHTML = '<div class="skills-loading">加载中...</div>';
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/available`, { headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          const items = await r.json();
          const builtin = items.filter((s) => s.origin === 'builtin');
          const mine = items.filter((s) => s.origin === 'mine');
          const added = items.filter((s) => s.origin === 'added');
          body.innerHTML = `
            <div class="skills-section">
              <div class="skills-section-title">🏛️ 官方内置 <span class="sh-count">${builtin.length}</span></div>
              <div class="skills-grid">${builtin.map(renderBuiltinCard).join('') || '<div class="skills-empty">暂无内置技能</div>'}</div>
            </div>
            <div class="skills-section">
              <div class="skills-section-title">✍️ 我创建的 <span class="sh-count">${mine.length}</span></div>
              ${mine.length ? `<div class="skills-grid">${mine.map(renderMineCard).join('')}</div>` : '<div class="skills-empty">还没有创建技能，可到「技能广场」上传 .zip / .skill / .md</div>'}
            </div>
            <div class="skills-section">
              <div class="skills-section-title">➕ 我已添加 <span class="sh-count">${added.length}</span></div>
              ${added.length ? `<div class="skills-grid">${added.map(renderAddedCard).join('')}</div>` : '<div class="skills-empty">还没有添加广场技能</div>'}
            </div>
          `;
        } catch (e) {
          body.innerHTML = `<div class="skills-empty">❌ 加载失败: ${escHtml(e.message)}</div>`;
        }
      }

      async function renderMarketplace() {
        const body = $('skillsBody');
        if (!body) return;
        body.innerHTML = '<div class="skills-loading">加载中...</div>';
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/marketplace`, { headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          const skills = await r.json();
          body.innerHTML = `
            <div class="skills-section">
              <div class="skills-section-title">⬆️ 上传新技能</div>
              <div class="skills-upload-form">
                <input type="file" id="skillFileInput" accept=".zip,.skill,.md" />
                <input type="text" id="skillDisplayName" placeholder="展示名（可选，默认取 name）" />
                <input type="text" id="skillDescription" placeholder="技能描述（可选，默认取 description）" />
                <button class="sc-btn sc-btn-primary" onclick="uploadSkill()">上传</button>
              </div>
              <div class="skills-empty" style="padding:2px 0 0">支持 .zip 压缩包、.skill 技能包（zip 或 Markdown 均可）、或 .md 单文件。一个 zip 归档只能包含一个技能，多个技能请分开打包。上传后保存为「草稿」，在「我的技能」中发布，经管理员审核后进入广场。</div>
            </div>
            <div class="skills-section">
              <div class="skills-section-title">🏪 技能广场 <span class="sh-count">${skills.length}</span></div>
              ${skills.length ? `<div class="skills-grid">${skills.map(renderMarketCard).join('')}</div>` : '<div class="skills-empty">广场暂无已审核技能</div>'}
            </div>
          `;
        } catch (e) {
          body.innerHTML = `<div class="skills-empty">❌ 加载失败: ${escHtml(e.message)}</div>`;
        }
      }

      async function renderReviewQueue() {
        const body = $('skillsBody');
        if (!body) return;
        body.innerHTML = '<div class="skills-loading">加载中...</div>';
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/pending`, { headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          const skills = await r.json();
          body.innerHTML = `
            <div class="skills-section">
              <div class="skills-section-title">🔍 待审核 <span class="sh-count">${skills.length}</span></div>
              ${skills.length ? `<div class="skills-grid">${skills.map(renderPendingCard).join('')}</div>` : '<div class="skills-empty">没有待审核的技能</div>'}
            </div>
          `;

          body.innerHTML = `<div class="skills-empty">❌ 加载失败: ${escHtml(e.message)}</div>`;

      function renderPendingCard(s) {
        return `<div class="skill-card">
          <div class="sc-top">
            <span class="sc-icon">${getSkillIcon(s.name)}</span>
            <span class="sc-name" title="${escHtml(s.display_name || s.name)}">${escHtml(s.display_name || s.name)}</span>

          <div class="sc-desc" title="${escHtml(s.description || '')}">${escHtml(s.description || '暂无描述')}</div>

            <button class="sc-btn sc-btn-primary" onclick="reviewSkill('${escJs(s.name)}','approve')">通过</button>
            <button class="sc-btn sc-btn-danger" onclick="reviewSkill('${escJs(s.name)}','reject')">驳回</button>
          </div>
        </div>`;
      }

      async function reviewSkill(name, action) {
        const body = { action };
        if (action === 'reject') {
          const reason = prompt('请输入驳回原因（作者可见）：');
          if (reason === null) return; // 取消
          if (!reason.trim()) {
            alert('驳回原因不能为空');
            return;
          }
          body.reason = reason.trim();
        }
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/${encodeURIComponent(name)}/review`, {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify(body),
          });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          renderReviewQueue();
        } catch (e) {
          alert(`❌ 审核失败: ${e.message}`);
        }
      }

      function renderBuiltinCard(s) {
        return `<div class="skill-card">
          <div class="sc-top">
            <span class="sc-icon">${getSkillIcon(s.name)}</span>
            <span class="sc-name" title="${escHtml(s.name)}">${escHtml(s.name)}</span>
            <span class="sc-badge builtin">内置</span>
          </div>
          <div class="sc-desc" title="${escHtml(s.description || '')}">${escHtml(s.description || '暂无描述')}</div>
        </div>`;
      }

      function renderMineCard(s) {
        const meta = skillStatusMeta(s.review_status);
        const canPublish = s.review_status === 'draft' || s.review_status === 'rejected';
        const publishLabel = s.review_status === 'rejected' ? '重新提交' : '发布';

          ? `<div class="sc-note">💬 驳回原因: ${escHtml(s.review_note)}</div>`
          : '';
        return `<div class="skill-card">
          <div class="sc-top">
            <span class="sc-icon">${getSkillIcon(s.name)}</span>
            <span class="sc-name" title="${escHtml(s.display_name || s.name)}">${escHtml(s.display_name || s.name)}</span>
            <span class="sc-badge ${meta.cls}">${meta.label}</span>
          </div>
          <div class="sc-desc" title="${escHtml(s.description || '')}">${escHtml(s.description || '暂无描述')}</div>

      function renderAddedCard(s) {
        return `<div class="skill-card">
          <div class="sc-top">
            <span class="sc-icon">${getSkillIcon(s.name)}</span>
            <span class="sc-name" title="${escHtml(s.display_name || s.name)}">${escHtml(s.display_name || s.name)}</span>
          </div>
          <div class="sc-desc" title="${escHtml(s.description || '')}">${escHtml(s.description || '暂无描述')}</div>
          <div class="sc-actions">
            <button class="sc-btn sc-btn-danger" onclick="removeAddedSkill('${escJs(s.name)}')">取消添加</button>

        </div>`;

      function renderMarketCard(s) {
        return `<div class="skill-card">
          <div class="sc-top">
            <span class="sc-icon">${getSkillIcon(s.name)}</span>
            <span class="sc-name" title="${escHtml(s.display_name || s.name)}">${escHtml(s.display_name || s.name)}</span>
          </div>
          <div class="sc-desc" title="${escHtml(s.description || '')}">${escHtml(s.description || '暂无描述')}</div>
          <div class="sc-meta">作者: ${escHtml(s.author_name || '未知')}${s.version ? ` · v${escHtml(s.version)}` : ''}</div>
          <div class="sc-actions">
            ${s.added
              ? `<button class="sc-btn sc-btn-danger" onclick="removeAddedSkill('${escJs(s.name)}')">已添加 · 取消</button>`

          </div>
        </div>`;

      async function uploadSkill() {
        const fileInput = $('skillFileInput');
        const file = fileInput && fileInput.files[0];
        if (!file) {
          alert('请先选择 .zip / .skill / .md 文件');
          return;
        }
        const displayName = ($('skillDisplayName') ? $('skillDisplayName').value : '').trim();
        const description = ($('skillDescription') ? $('skillDescription').value : '').trim();
        const fd = new FormData();
        fd.append('file', file);
        if (displayName) fd.append('display_name', displayName);
        if (description) fd.append('description', description);
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills`, {
            method: 'POST',
            headers: authHeaders(),
            body: fd,
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data.detail || `${r.status} ${r.statusText}`);
          alert(`✅ 上传成功：「${data.skill_name}」已保存为草稿，可在「我的技能」中发布`);
          showSkills('mine');
        } catch (e) {
          alert(`❌ 上传失败: ${e.message}`);
        }
      }

      async function publishSkill(name) {
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/${encodeURIComponent(name)}/publish`, { method: 'POST', headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          renderMySkills();
        } catch (e) {
          alert(`❌ 发布失败: ${e.message}`);
        }
      }

      async function deleteSkill(name) {
        if (!confirm(`确定删除技能「${name}」？技能文件将从存储中永久删除，且不可恢复。`)) return;
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/${encodeURIComponent(name)}`, { method: 'DELETE', headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          renderMySkills();
        } catch (e) {
          alert(`❌ 删除失败: ${e.message}`);
        }
      }

      async function addSkill(name) {
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/${encodeURIComponent(name)}/add`, { method: 'POST', headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          renderMarketplace();
        } catch (e) {
          alert(`❌ 添加失败: ${e.message}`);
        }
      }

      async function removeAddedSkill(name) {
        try {
          const r = await fetch(`${baseUrl()}/py/api/skills/${encodeURIComponent(name)}/add`, { method: 'DELETE', headers: headers() });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${await r.text()}`);
          refreshSkillsBody();
        } catch (e) {
          alert(`❌ 取消添加失败: ${e.message}`);
        }
      }

        $('input-area').classList.remove('hidden');

      // ═══════════════════════ SEND ═══════════════════════
      async function send() {
        // If a stream is active, stop it instead
        if (streamAbortController) {
          stopStream();
          return;
        }

        const input = $('userInput');
        const msg = input.value.trim();
        if (!msg) {
          // 纯文件发送（无文字）：无法单独发起一轮对话。清空待发文件，
          // 避免附件一直残留在输入区，并给出提示。
          if (selectedFiles.length > 0) {
            selectedFiles = [];
            renderFileChips();
            updateSendBtn();
            addSysMsg('💡 仅上传了文件，请输入文字后再发送。');
          }
          return;
        }

        // Snapshot this turn's files + metadata up front. We create the
        // conversation WITHOUT files first (fast — just a DB insert), then
        // upload files to the existing conversation via /{id}/files. This
        // decouples the slow upload (local write + remote storage) from
        // conversation creation, so the user message renders immediately and
        // the UI no longer freezes behind a long POST /conversations.
        const filesToUpload = selectedFiles.slice();
        const fileMeta =
          filesToUpload.length > 0
            ? JSON.stringify(
                filesToUpload.map((f) => ({ filename: f.name, size: f.size })),
              )
            : null;

        input.value = '';
        autoResizeTextarea();
        updateSendBtn();
        input.disabled = true;

        // ── 1. Ensure a conversation exists (no files → fast) ───────────────
        if (!conversationId) {
          try {
            const h = {};
            if (token()) h['Authorization'] = `Bearer ${token()}`;
            const r = await fetch(`${baseUrl()}/py/api/conversations`, {
              method: 'POST',
              headers: h,
            });
            if (!r.ok) {
              const err = await r.text();
              throw new Error(`${r.status} ${r.statusText}: ${err}`);
            }
            const data = await r.json();
            conversationId = data.conversation_id;
            // 占位标题：发消息那一刻即用截断的用户消息，随后被 AI 标题替换
            activeConvTitle = _fallbackTitle(msg) || '新对话';
            $('convTitle').textContent = activeConvTitle;
            setActiveConv(conversationId);
            // 立即让新会话浮到列表顶部（后端此刻 status=active，前端映射为 running 脉冲）
            loadConversations().then(() =>
              updateConvListItemTitle(conversationId, activeConvTitle),
            );
          } catch (e) {
            addSysMsg('❌ 创建会话失败: ' + e.message);
            input.disabled = false;
            updateSendBtn();
            input.focus();
            return;
          }
        }

        // Clear the input-area chips now — files are captured in `filesToUpload`
        // and `fileMeta`; they'll be re-rendered inside the user message bubble.
        selectedFiles = [];
        renderFileChips();

        // ── 2. Show the user message immediately ─────────────────────────────
        addMsg('user', msg, fileMeta);

        // ── 3. Upload files (agent needs them on disk before the stream) ─────
        if (filesToUpload.length > 0) {
          _setUploadStatus('正在上传附件…');
          try {
            const h = {};
            if (token()) h['Authorization'] = `Bearer ${token()}`;
            const formData = new FormData();
            for (const f of filesToUpload) {
              formData.append('files', f);
            }
            const r = await fetch(
              `${baseUrl()}/py/api/conversations/${conversationId}/files`,
              { method: 'POST', headers: h, body: formData },
            );
            if (!r.ok) {
              const err = await r.text();
              throw new Error(`${r.status} ${r.statusText}: ${err}`);
            }
          } catch (e) {
            addSysMsg('⚠️ 附件上传失败: ' + e.message);
          }
          _removeUploadStatus();
        }

        // ── 4. Start the stream (button flips to 「停止」 only now) ──────────
        enterStreamingMode();
        await sendStream(msg, thinkingEnabled, fileMeta);
      }

      // ── Upload status bar (mirrors the in-stream「生成中」bar) ─────────────
      // Shown during the file-upload step so the page never looks frozen while
      // a large attachment is written to local disk + remote storage.
      let _uploadStatusEl = null;
      function _setUploadStatus(text) {
        if (!_uploadStatusEl || !_uploadStatusEl.parentNode) {
          _uploadStatusEl = document.createElement('div');
          _uploadStatusEl.className = 'gen-status';
          _uploadStatusEl.innerHTML =
            '<span class="gen-spinner"></span><span class="gen-label"></span>';
          const inputArea = $('input-area');
          inputArea.parentNode.insertBefore(_uploadStatusEl, inputArea);
        }
        _uploadStatusEl.querySelector('.gen-label').textContent = text;
      }
      function _removeUploadStatus() {
        if (_uploadStatusEl) {
          _uploadStatusEl.remove();
          _uploadStatusEl = null;
        }
      }

      // ── Streaming mode helpers ──────────────────────────────────────────────

      function enterStreamingMode() {
        const btn = $('sendBtn');
        btn.textContent = '停止';
        btn.classList.add('btn-stop');
        btn.disabled = false; // Always enabled in stop mode
      }

      function exitStreamingMode() {
        const btn = $('sendBtn');
        btn.textContent = '发送';
        btn.classList.remove('btn-stop');
        streamAbortController = null;
        updateSendBtn();
      }

      function stopStream() {
        // Immediately reflect the stop in the UI and fire the cancel
        // request WITHOUT awaiting it — the click should feel instant.
        // The running stream then emits run_end(cancelled), which drives
        // all cleanup (exitStreamingMode, re-enable input, etc.) on its own.
        const btn = $('sendBtn');
        if (btn) {
          btn.textContent = '停止中…';
          btn.disabled = true;
        }

        const h = {};
        if (token()) h['Authorization'] = `Bearer ${token()}`;
        const formData = new URLSearchParams();
        formData.append('conversation_id', conversationId);
        fetch(`${baseUrl()}/py/api/chat/stream/stop`, {
          method: 'POST',
          headers: {
            ...h,
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData,
        }).catch(() => {
          // If /stop fails, fall back to abort so the stream still ends.
          if (streamAbortController) {
            streamAbortController.abort();
            streamAbortController = null;
          }
        });
      }

      function _addCancelledNote(container) {
        const note = document.createElement('div');
        note.className = 'cancelled-note';
        note.innerHTML = '⚠️ 生成被中断';
        container.appendChild(note);
      }

      async function sendStream(msg, thinkingEnabled, fileMeta) {
        // Create a placeholder message for streaming
        const w = $('messages').querySelector('.msg.welcome');
        if (w) w.remove();

        const div = document.createElement('div');
        div.className = 'msg assistant';
        div.id = 'streaming-msg';

        $('messages').appendChild(div);
        $('messages').scrollTop = $('messages').scrollHeight;

        // Persistent "生成中" status bar tracking.
        // Declared before the immediate _setGenStatus() call below so it
        // is initialized (no temporal-dead-zone error).
        let genStatusEl = null;
        // Detach guard: when a new conversation/stream starts, it takes over
        // the global `streamAbortController`.  A superseded stream detects the
        // mismatch and stops touching the UI, so a stale "生成中" bar is never
        // re-created after the user opens a new conversation.
        let detached = false;
        const myController = new AbortController();
        streamAbortController = myController;

        // Show the "生成中" spinner immediately (before the network round-trip),
        // so even the fetch/connection delay has a visible animation.
        _setGenStatus('正在生成…');

        // ── Interleaved text + tool rendering ───────────────────────────────
        // Agent output is: text → tool → text → tool → text (chronological)
        // We track text segments and insert tool cards between them.
        let curText = ''; // text accumulated since last tool call
        let curSeg = null; // current text segment DOM element (or null)
        let streamConvId = conversationId;
        let pendingCards = {}; // { run_id: {name, input, el, isSubagent, description} }
        let hasError = false;
        let hasCancelled = false; // set when finish_reason is "cancelled"
        let curReasoning = ''; // reasoning content accumulated
        let curReasoningEl = null; // reasoning card DOM element
        let curReasoningPre = null; // reasoning <pre> element (direct ref)

        function _ensureSeg() {
          if (!curSeg) {
            curSeg = document.createElement('div');
            curSeg.className = 'msg-body';
            div.appendChild(curSeg);
          }
          return curSeg;
        }
        function _closeSeg() {
          // Finalize current text segment: render markdown if it has content, remove if empty
          if (curSeg) {
            if (curText.trim()) {
              curSeg.innerHTML = renderAssistantContent(curText);
            } else {
              curSeg.remove();
            }
            curSeg = null;
            curText = '';
          }
        }
        function _fmtElapsed(secs) {
          const s = Math.floor(secs || 0);
          const mins = Math.floor(s / 60);
          const sec = s % 60;
          return mins > 0 ? `${mins}分${sec}秒` : `${sec}秒`;
        }
        // A persistent "生成中" status bar pinned to the top of the assistant
        // bubble.  It lives from run_start to run_end, its spinner keeps
        // animating the whole time, and only the phase label changes — so the
        // page never looks frozen while the agent is working.
        function _ensureGenStatus() {
          if (detached) return null;
          if (!genStatusEl || !genStatusEl.parentNode) {
            genStatusEl = document.createElement('div');
            genStatusEl.className = 'gen-status';
            genStatusEl.innerHTML =
              '<span class="gen-spinner"></span><span class="gen-label">正在生成…</span>';
            // Pin the status bar just above the input area — fixed at the
            // bottom of the viewport, not scrolled away with the messages.
            const inputArea = $('input-area');
            inputArea.parentNode.insertBefore(genStatusEl, inputArea);
          }
          return genStatusEl;
        }
        function _setGenStatus(text) {
          const el = _ensureGenStatus();
          if (!el) return null;
          const label = el.querySelector('.gen-label');
          if (label) label.textContent = text;
          return el;
        }
        function _removeGenStatus() {
          if (genStatusEl) {
            genStatusEl.remove();
            genStatusEl = null;
          }
        }
        function _setThinkingStatus() {
          // 静默期文案：开深度思考 →「思考中」，否则只是普通生成 →「生成中」。
          // thinking_start / tool_end / progress(thinking) 是「模型安静期」的通用
          // 信号，并不一定代表深度推理；只有 reasoning 事件才是真正的深度思考内容。
          _setGenStatus(thinkingEnabled ? '思考中…' : '生成中…');
        }

        try {
          const h = {};
          if (token()) h['Authorization'] = `Bearer ${token()}`;

          // Build FormData — conversation_id is always required
          const formData = new FormData();
          formData.append('message', msg);
          formData.append('conversation_id', conversationId);
          formData.append(
            'thinking_enabled',
            thinkingEnabled ? 'true' : 'false',
          );
          if (selectedModel) formData.append('model_name', selectedModel);
          if (fileMeta) formData.append('file_metadatas', fileMeta);

          const r = await fetch(`${baseUrl()}/py/api/chat/stream`, {
            method: 'POST',
            headers: h,
            body: formData,
            signal: myController.signal,
          });
          if (!r.ok) {
            div.remove();
            const err = await r.text();
            throw new Error(`${r.status} ${r.statusText}: ${err}`);
          }

          const reader = r.body.getReader();
          const decoder = new TextDecoder();
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            // Detach guard: a new conversation/stream has taken over the
            // global controller — stop touching the UI so this stale loop
            // never re-creates the "生成中" bar after the user switched away.
            if (streamAbortController !== myController) {
              detached = true;
              break;
            }
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const payload = line.slice(6);
              if (payload === '[DONE]') break;

              try {
                const evt = JSON.parse(payload);
                const evtType = evt.type;
                const delta = evt.choices?.[0]?.delta || {};

                if (evtType === 'run_start') {
                  if (delta.conversation_id)
                    streamConvId = delta.conversation_id;
                  _setGenStatus('正在生成…');
                  // 回合开始，后端已写入 status=running + 占位标题，刷新侧栏
                  // 让新会话以「生成中」脉冲点出现在顶部。
                  loadConversations();
                } else if (evtType === 'run_end') {
                  const reason = evt.choices?.[0]?.finish_reason;
                  if (reason === 'cancelled') {
                    hasCancelled = true;
                  }
                  _removeGenStatus();
                } else if (evtType === 'thinking_start') {
                  // New LLM call — reset reasoning accumulator for this call
                  curReasoning = '';
                  curReasoningEl = null;
                  curReasoningPre = null;
                  _setThinkingStatus();
                } else if (evtType === 'token') {
                  _setGenStatus('生成中…');
                  curText += delta.content || '';
                  _ensureSeg().innerHTML = renderAssistantContent(curText);
                  $('messages').scrollTop = $('messages').scrollHeight;
                } else if (evtType === 'reasoning') {
                  _closeSeg();
                  _setThinkingStatus();
                  const content = delta.content || '';
                  // Handle both delta and full-content modes from the API:
                  // - If the new content starts with the old, the API sends full content → replace
                  // - Otherwise the API sends deltas → accumulate
                  if (content.startsWith(curReasoning)) {
                    curReasoning = content;
                  } else {
                    curReasoning += content;
                  }
                  if (!curReasoningEl) {
                    curReasoningEl = document.createElement('div');
                    curReasoningEl.className = 'tool-card';
                    curReasoningEl.classList.add('expanded');
                    curReasoningEl.innerHTML = `<div class="tc-header" onclick="this.parentElement.classList.toggle('expanded')"><span style="color:var(--text2);flex:1">💭 思考</span><span class="tc-arrow">▸</span></div>`;
                    const body = document.createElement('div');
                    body.className = 'tc-body';
                    curReasoningPre = document.createElement('pre');
                    curReasoningPre.style.cssText =
                      'color:var(--text2);margin:0;white-space:pre-wrap;font-size:12px';
                    body.appendChild(curReasoningPre);
                    curReasoningEl.appendChild(body);
                    div.appendChild(curReasoningEl);
                  }
                  curReasoningPre.textContent = curReasoning;
                  $('messages').scrollTop = $('messages').scrollHeight;
                } else if (evtType === 'tool_start') {
                  _closeSeg(); // close the text segment before this tool
                  // Support both flat format (evt.tool/input/is_subagent) and
                  // OpenAI-style format (delta.tool/delta.input/delta.is_subagent).
                  const tool = evt.tool || delta.tool || 'unknown';
                  const input = evt.input || delta.input || '';
                  const isSub = (evt.is_subagent || delta.is_subagent) === true;
                  // Use backend-provided description for subagent display, or
                  // extract from input JSON as fallback.
                  const desc = evt.description || delta.description || '';
                  const runId = evt.run_id || delta.run_id || '';
                  _setGenStatus(
                    isSub ? '委派子代理中…' : '执行工具中…',
                  );
                  const card = createToolCard(
                    tool,
                    input,
                    null,
                    true,
                    isSub,
                    desc,
                  );
                  div.appendChild(card);
                  pendingCards[runId] = {
                    name: tool,
                    input: input,
                    el: card,
                    isSubagent: isSub,
                    description: desc,
                  };
                  $('messages').scrollTop = $('messages').scrollHeight;
                } else if (evtType === 'tool_end') {
                  _setThinkingStatus();
                  // Support both flat format and OpenAI-style format
                  const tool = evt.tool || delta.tool || 'unknown';
                  const output = evt.output || delta.output || '';
                  const isSubFromEvt =
                    (evt.is_subagent || delta.is_subagent) === true;
                  const elapsed = evt.elapsed_seconds;
                  const toolErr = evt.error || delta.error || '';
                  const runId = evt.run_id || delta.run_id || '';
                  const pending = pendingCards[runId];
                  if (pending) {
                    // Replace the pending card with a completed one
                    const isSub = pending.isSubagent || isSubFromEvt;
                    const desc = pending.description || '';
                    const newCard = createToolCard(
                      pending.name,
                      pending.input,
                      output,
                      false,
                      isSub,
                      desc,
                      elapsed,
                      toolErr,
                    );
                    pending.el.replaceWith(newCard);
                    delete pendingCards[runId];
                  } else {
                    // Orphan tool_end — create a standalone card
                    div.appendChild(
                      createToolCard(
                        tool,
                        null,
                        output,
                        false,
                        isSubFromEvt,
                        '',
                        elapsed,
                        toolErr,
                      ),
                    );
                  }
                  $('messages').scrollTop = $('messages').scrollHeight;
                } else if (evtType === 'error') {
                  _closeSeg();
                  _removeGenStatus();
                  const errMsg = evt.message || delta.message || '未知错误';
                  if ((evt.recoverable || delta.recoverable) === true) {
                    // Recoverable interruption (step limit) — render as a
                    // hint, not a hard error, so the user knows they can
                    // continue the task.
                    const hintEl = document.createElement('div');
                    hintEl.className = 'tool-card';
                    hintEl.innerHTML = `<div class="tc-header" style="cursor:default"><span style="color:var(--yellow)">💡 提示</span></div><div class="tc-body" style="display:block;border-top:1px solid var(--border);padding:8px 10px"><pre style="color:var(--text2);white-space:pre-wrap;margin:0">${escHtml(errMsg)}</pre></div>`;
                    div.appendChild(hintEl);
                  } else {
                    hasError = true;
                    const errEl = document.createElement('div');
                    errEl.className = 'tool-card';
                    errEl.innerHTML = `<div class="tc-header" style="cursor:default"><span style="color:var(--red)">❌ 错误</span></div><div class="tc-body" style="display:block;border-top:1px solid var(--border);padding:8px 10px"><pre style="color:var(--red)">${escHtml(errMsg)}</pre></div>`;
                    div.appendChild(errEl);
                  }
                } else if (evtType === 'subagent_progress') {
                  // Update the pending subagent card + status bar with elapsed time
                  const runId = evt.run_id || delta.run_id || '';
                  const elapsed = evt.elapsed_seconds || delta.elapsed_seconds;
                  if (elapsed !== undefined) {
                    _setGenStatus(`委派子代理中… (${_fmtElapsed(elapsed)})`);
                  }
                  // 状态栏已展示耗时，中间内容区（工具卡片）不再重复展示时间。
                  const pending = pendingCards[runId];
                  if (pending) {
                    const pendingEl = pending.el.querySelector('.tc-pending');
                    if (pendingEl) {
                      pendingEl.textContent = `⏳ 子代理执行中…`;
                    }
                  }
                } else if (evtType === 'progress') {
                  // 1s heartbeat during quiet periods.  phase ∈
                  // {thinking, tool}.  Update the persistent status bar
                  // (and the pending tool card when relevant).
                  const phase = evt.phase || delta.phase || 'thinking';
                  if (phase === 'thinking') {
                    // 静默期不显示耗时（统一无时间），只有子代理委派显示耗时。
                    _setThinkingStatus();
                  } else {
                    _setGenStatus('执行工具中…');
                  }
                  const runId = evt.run_id || delta.run_id || '';
                  const pending = pendingCards[runId];
                  if (pending) {
                    const pendingEl = pending.el.querySelector('.tc-pending');
                    if (pendingEl) {
                      if (pending.isSubagent) {
                        pendingEl.textContent = `⏳ 子代理执行中…`;
                      } else {
                        pendingEl.textContent = `⏳ 执行中…`;
                      }
                    }
                  }
                }
              } catch (parseErr) {
                // Legacy format fallback
                try {
                  const data = JSON.parse(payload);
                  if (data.token) {
                    curText += data.token;
                    _ensureSeg().innerHTML = renderAssistantContent(curText);
                    $('messages').scrollTop = $('messages').scrollHeight;
                  }
                  if (data.conversation_id) streamConvId = data.conversation_id;
                } catch {}
              }
            }
          }

          // Detach guard: this stream was superseded by a new
          // conversation/stream — the new one owns the status bar, so just
          // clear any leftover and return without mutating the (now stale) UI.
          if (detached) {
            _removeGenStatus();
            return;
          }

          div.removeAttribute('id');
          // Show cancelled indicator if the stream was interrupted
          if (hasCancelled) {
            _addCancelledNote(div);
          }
          // Finalize the last text segment
          _removeGenStatus();
          _closeSeg();
          if (streamConvId) {
            conversationId = streamConvId;
            $('convTitle').textContent =
              activeConvTitle || conversationId.substring(0, 8) + '...';
            setActiveConv(conversationId);
          }
          // If nothing was rendered at all, show a placeholder.
          // If an error was signalled, show error text instead of "(空响应)".
          if (
            !div.querySelector('.msg-body') &&
            !div.querySelector('.tool-card')
          ) {
            const empty = document.createElement('div');
            empty.className = 'msg-body';
            empty.textContent = hasError ? '(请求出错，请重试)' : '(空响应)';
            div.appendChild(empty);
          }

          // Refresh conversation list + artifacts panel
          loadConversations();
          refreshFileTree();

          // Restore UI state (always, for both normal & cancelled paths)
          exitStreamingMode();
          const input = $('userInput');
          if (input) {
            input.disabled = false;
            input.focus();
          }
        } catch (e) {
          // AbortError is expected when /stop fails and we fall back to abort
          if (e.name === 'AbortError') {
            // Append cancelled note to the streaming message if still present
            const el = document.getElementById('streaming-msg');
            if (el) {
              _closeSeg();
              _addCancelledNote(el);
              el.removeAttribute('id');
              loadConversations();
              refreshFileTree();
            }
            exitStreamingMode();
            const input = $('userInput');
            if (input) {
              input.disabled = false;
              input.focus();
            }
            return;
          }
          const el = document.getElementById('streaming-msg');
          if (el) el.remove();
          addMsg('system', '❌ 流式错误: ' + e.message);
          // 刷新会话列表，避免状态点停留在「生成中」脉冲。
          loadConversations();
          exitStreamingMode();
          const input = $('userInput');
          if (input) {
            input.disabled = false;
            input.focus();
          }
        }
      }

      // ═══════════════════════ QUICK ═══════════════════════
      function quickSend(msg) {
        // If the user explicitly selected a historical conversation in the
        // sidebar, debug quick-send reuses it (so test messages land in the
        // viewed conversation).  Otherwise — fresh start, new conversation,
        // or page refresh — create a brand-new conversation.
        if (!conversationId) {
          newConversation();
        }
        $('userInput').value = msg;
        autoResizeTextarea();
        send();
      }

      // ═══════════════════════ FILE LINKIFY ═══════════════════════
      const _FILE_PATH_RE =
        /(?<![">])(\/mnt\/user-data\/(?:outputs|uploads|workspace)\/[^\s<>"'&，。；：！？、（）【】「」《》]+(?:\.\w[\w.]*)?)/g;

      function linkifyFilePaths(html) {
        if (!html) return html;
        return html.replace(_FILE_PATH_RE, (match) => {
          const filename = match.split('/').pop();
          // Match might end with punctuation that isn't part of the filename
          return `<a class="file-link" data-path="${escHtml(match)}" onclick="openFileModal('${escJs(match)}')" title="点击预览 / 下载">📄 ${escHtml(filename)}</a>`;
        });
      }

      // A wrapper that runs marked + linkify for assistant messages
      function renderAssistantContent(markdownText) {
        return linkifyFilePaths(marked.parse(markdownText));
      }

      // Post-process already-rendered DOM to linkify file paths
      function linkifyFilePathsInDOM(rootEl) {
        const bodies = rootEl.querySelectorAll('.msg-body');
        bodies.forEach((body) => {
          // Only process if it hasn't been linkified yet
          if (body.querySelector('.file-link')) return;
          // Re-render: get original markdown from parsed HTML
          // Simpler approach: walk text nodes and replace
          const walker = document.createTreeWalker(
            body,
            NodeFilter.SHOW_TEXT,
            null,
            false,
          );
          const replacements = [];
          while (walker.nextNode()) {
            const node = walker.currentNode;
            // Skip nodes inside file links or tool cards or code blocks
            if (
              node.parentElement.closest('.file-link, .tool-card, pre, code, a')
            )
              continue;
            let text = node.textContent;
            let match;
            let lastIndex = 0;
            let fragments = [];
            _FILE_PATH_RE.lastIndex = 0;
            while ((match = _FILE_PATH_RE.exec(text)) !== null) {
              fragments.push(
                document.createTextNode(text.slice(lastIndex, match.index)),
              );
              const filename = match[0].split('/').pop();
              const a = document.createElement('a');
              a.className = 'file-link';
              a.dataset.path = match[0];
              a.title = '点击预览 / 下载';
              a.innerHTML = `📄 ${escHtml(filename)}`;
              a.onclick = function (e) {
                e.preventDefault();
                openFileModal(match[0]);
              };
              fragments.push(a);
              lastIndex = _FILE_PATH_RE.lastIndex;
            }
            if (fragments.length > 0) {
              fragments.push(document.createTextNode(text.slice(lastIndex)));
              const container = document.createDocumentFragment();
              fragments.forEach((f) => container.appendChild(f));
              node.parentElement.replaceChild(container, node);
            }
          }
        });
      }

      // ═══════════════════════ FILE MODAL ═══════════════════════
      let _currentFile = {
        path: '',
        downloadUrl: '',
        infoUrl: '',
        blobUrl: '',
      };

      // Fetch file as blob with auth headers, returns object URL
      async function fetchFileBlob(virtualPath) {
        const viewUrl = `${baseUrl()}/py/api/chat/files/${conversationId}?path=${encodeURIComponent(virtualPath)}`;
        const r = await fetch(viewUrl, { headers: headers() });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const blob = await r.blob();
        return URL.createObjectURL(blob);
      }

      function openFileModal(virtualPath) {
        const convId = conversationId;
        if (!convId) {
          alert('请先开始一个对话');
          return;
        }

        _currentFile.path = virtualPath;
        _currentFile.blobUrl = '';
        const infoUrl = `${baseUrl()}/py/api/chat/files/${convId}/info?path=${encodeURIComponent(virtualPath)}`;

        // Show overlay + loading state
        const overlay = $('fileModalOverlay');
        overlay.classList.add('open');
        $('fmName').textContent = virtualPath.split('/').pop() || 'file';
        $('fmSize').textContent = '加载中...';
        $('fmType').textContent = '';
        $('fmIcon').textContent = '📄';
        $('fmBody').innerHTML =
          '<div class="fm-placeholder"><div style="font-size:28px;margin-bottom:8px">⏳</div>加载中...</div>';

        // Fetch file info
        fetch(infoUrl, { headers: headers() })
          .then((r) => {
            if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
            return r.json();
          })
          .then((info) => renderFilePreview(info))
          .catch((err) => {
            $('fmBody').innerHTML =
              `<div class="fm-placeholder"><div class="fm-big-icon">❌</div><div class="fm-hint">加载文件信息失败<br><small>${escHtml(err.message)}</small></div></div>`;
            $('fmSize').textContent = '加载失败';
          });
      }

      function renderFilePreview(info) {
        // Header
        $('fmName').textContent = info.filename;
        $('fmSize').textContent = formatFileSize(info.size);
        $('fmType').textContent = info.content_type || info.extension;
        const ext = (info.extension || '').toLowerCase();

        // Icon by type
        const iconMap = {
          '.png': '🖼️',
          '.jpg': '🖼️',
          '.jpeg': '🖼️',
          '.gif': '🖼️',
          '.svg': '🖼️',
          '.webp': '🖼️',
          '.bmp': '🖼️',
          '.pdf': '📕',
          '.mp4': '🎬',
          '.webm': '🎬',
          '.mov': '🎬',
          '.mp3': '🎵',
          '.wav': '🎵',
          '.flac': '🎵',
          '.ogg': '🎵',
          '.zip': '📦',
          '.tar': '📦',
          '.gz': '📦',
          '.rar': '📦',
          '.7z': '📦',
          '.pptx': '📊',
          '.docx': '📝',
          '.xlsx': '📈',
          '.py': '🐍',
          '.js': '💛',
          '.ts': '🔷',
          '.html': '🌐',
          '.css': '🎨',
          '.json': '📋',
        };
        $('fmIcon').textContent = iconMap[ext] || '📄';

        if (!info.previewable) {
          $('fmBody').innerHTML = `
      <div class="fm-placeholder">
        <div class="fm-big-icon">${iconMap[ext] || '📄'}</div>
        <div class="fm-hint">
          <strong>${escHtml(info.filename)}</strong><br>
          ${formatFileSize(info.size)} &middot; ${escHtml(info.content_type || '未知类型')}<br>
          <small style="color:var(--text2);margin-top:6px;display:block">此文件类型不支持在线预览</small>
        </div>
      </div>`;
          return;
        }

        // Preview via blob URL (fetch with auth, then render locally)
        fetchFileBlob(_currentFile.path)
          .then((blobUrl) => {
            _currentFile.blobUrl = blobUrl;
            const ext = (info.extension || '').toLowerCase();
            if (
              [
                '.png',
                '.jpg',
                '.jpeg',
                '.gif',
                '.svg',
                '.webp',
                '.bmp',
                '.ico',
              ].includes(ext)
            ) {
              $('fmBody').innerHTML =
                `<img src="${blobUrl}" alt="${escHtml(info.filename)}" onerror="this.parentElement.innerHTML='<div class=\\'fm-placeholder\\'><div class=\\'fm-big-icon\\'>❌</div>加载预览失败</div>'">`;
            } else if (ext === '.pdf') {
              $('fmBody').innerHTML =
                `<iframe src="${blobUrl}" title="${escHtml(info.filename)}"></iframe>`;
            } else if (['.mp4', '.webm', '.ogg'].includes(ext)) {
              $('fmBody').innerHTML =
                `<video controls style="max-width:100%;max-height:60vh"><source src="${blobUrl}" type="${info.content_type}">不支持播放</video>`;
            } else if (['.mp3', '.wav', '.flac'].includes(ext)) {
              $('fmBody').innerHTML =
                `<div style="padding:40px;text-align:center"><audio controls src="${blobUrl}" style="width:100%;max-width:400px"></audio></div>`;
            } else {
              // Text files: fetch and display
              fetch(
                `${baseUrl()}/py/api/chat/files/${conversationId}?path=${encodeURIComponent(_currentFile.path)}`,
                { headers: headers() },
              )
                .then((r) => {
                  if (!r.ok) throw new Error(r.status);
                  return r.text();
                })
                .then((text) => {
                  $('fmBody').innerHTML = `<pre>${escHtml(text)}</pre>`;
                })
                .catch(() => {
                  $('fmBody').innerHTML =
                    `<div class="fm-placeholder"><div class="fm-big-icon">❌</div>加载预览失败</div>`;
                });
            }
          })
          .catch(() => {
            $('fmBody').innerHTML =
              `<div class="fm-placeholder"><div class="fm-big-icon">❌</div>加载预览失败</div>`;
          });
      }

      function closeFileModal() {
        $('fileModalOverlay').classList.remove('open');
        if (_currentFile.blobUrl) URL.revokeObjectURL(_currentFile.blobUrl);
        _currentFile = { path: '', blobUrl: '' };
      }

      async function downloadCurrentFile() {
        if (!_currentFile.path) return;
        try {
          // Resolve the self-authenticating URL and log it so it can be
          // opened manually (e.g. to verify the OBS signature).
          try {
            const ep =
              `${baseUrl()}/py/api/chat/files/${conversationId}/url?path=${encodeURIComponent(_currentFile.path)}` +
              '&download=true';
            const r = await fetch(ep, { headers: headers() });
            if (r.ok) {
              const data = await r.json();
              console.log('[file] download url:', data.url);
            } else {
              console.warn('[file] resolve url failed:', r.status);
            }
          } catch (err) {
            console.warn('[file] resolve url failed:', err);
          }

          // Download via a blob fetched through SkillHub (same-origin, carries
          // the JWT header) — the previous download method.
          const blobUrl =
            _currentFile.blobUrl || (await fetchFileBlob(_currentFile.path));
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = _currentFile.path.split('/').pop() || 'file';
          document.body.appendChild(a);
          a.click();
          a.remove();
        } catch (e) {
          console.error('Download failed:', e);
        }
      }

      // Keyboard: ESC to close modal
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeFileModal();
      });

      // ═══════════════════════ FILE TREE ═══════════════════════
      let _fileTreeRoots = [];

      function _iconForExt(ext) {
        const m = {
          '.py': '🐍',
          '.js': '💛',
          '.ts': '🔷',
          '.html': '🌐',
          '.css': '🎨',
          '.json': '📋',
          '.png': '🖼️',
          '.jpg': '🖼️',
          '.jpeg': '🖼️',
          '.gif': '🖼️',
          '.svg': '🖼️',
          '.webp': '🖼️',
          '.pdf': '📕',
          '.pptx': '📊',
          '.docx': '📝',
          '.xlsx': '📈',
          '.txt': '📄',
          '.md': '📝',
          '.csv': '📊',
          '.xml': '📋',
          '.yaml': '📋',
          '.yml': '📋',
          '.mp4': '🎬',
          '.webm': '🎬',
          '.mp3': '🎵',
          '.wav': '🎵',
          '.zip': '📦',
          '.tar': '📦',
          '.gz': '📦',
          '.rar': '📦',
          '.sh': '⚡',
          '.bash': '⚡',
          '.ps1': '⚡',
        };
        return m[ext] || '📄';
      }

      function _countTreeFiles(node) {
        let n = 0;
        if (node.type === 'file') return 1;
        if (node.children)
          for (const c of node.children) n += _countTreeFiles(c);
        return n;
      }

      function _renderTreeNode(node, depth) {
        const container = document.createElement('div');
        container.className = depth === 0 ? 'ft-root' : 'ft-dir';
        container.style.marginLeft = depth > 0 ? '0' : '';

        if (node.type === 'directory') {
          const header = document.createElement('div');
          header.className = depth === 0 ? 'ft-root-header' : 'ft-dir-header';
          // Toggle arrow
          const toggle = document.createElement('span');
          toggle.className = 'ft-toggle open';
          toggle.textContent = '▶';
          header.appendChild(toggle);
          // Icon + label
          const icon = document.createElement('span');
          icon.className = 'ft-icon';
          icon.textContent = depth === 0 ? '📁' : '📂';
          header.appendChild(icon);
          const label = document.createElement('span');
          label.className = 'ft-label';
          label.textContent = depth === 0 ? node.label || node.name : node.name;
          header.appendChild(label);
          // File count badge (root level only)
          if (depth === 0) {
            const badge = document.createElement('span');
            badge.className = 'ft-badge';
            badge.textContent = _countTreeFiles(node);
            header.appendChild(badge);
          }
          header.addEventListener('click', () => {
            const open = !toggle.classList.contains('open');
            toggle.classList.toggle('open', open);
            childrenEl.classList.toggle('collapsed', !open);
          });
          container.appendChild(header);

          const childrenEl = document.createElement('div');
          childrenEl.className =
            depth === 0 ? 'ft-children' : 'ft-dir-children';
          if (node.children) {
            for (const child of node.children) {
              childrenEl.appendChild(_renderTreeNode(child, depth + 1));
            }
          }
          container.appendChild(childrenEl);
        } else {
          // File node
          const row = document.createElement('div');
          row.className = 'ft-file';
          row.style.paddingLeft = depth * 14 + 4 + 'px';
          const icon = document.createElement('span');
          icon.className = 'ft-icon';
          icon.textContent = _iconForExt(node.extension || '');
          row.appendChild(icon);
          const name = document.createElement('span');
          name.className = 'ft-name';
          name.textContent = node.name;
          name.title = node.name;
          row.appendChild(name);
          const size = document.createElement('span');
          size.className = 'ft-size';
          size.textContent = formatFileSize(node.size || 0);
          row.appendChild(size);
          // Actions (visible on hover)
          const actions = document.createElement('span');
          actions.className = 'ft-actions';
          const vp = node.virtual_path;
          actions.innerHTML =
            '<button class="ft-btn-view" onclick="event.stopPropagation();openFileModal(\'' +
            escJs(vp) +
            '\')">预览</button>' +
            '<button class="ft-btn-dl" onclick="event.stopPropagation();downloadArtifact(\'' +
            escJs(vp) +
            '\')">⬇</button>';
          row.appendChild(actions);
          row.addEventListener('click', () => openFileModal(vp));
          container.appendChild(row);
        }
        return container;
      }

      function _renderFileTree(roots) {
        const list = $('apList');
        list.innerHTML = '';
        _fileTreeRoots = roots;
        let totalFiles = 0;
        roots
          .filter((r) => r.children && r.children.length > 0)
          .forEach((root) => {
            totalFiles += _countTreeFiles(root);
            list.appendChild(_renderTreeNode(root, 0));
          });
        if (totalFiles === 0) {
          list.innerHTML =
            '<div class="ap-empty">当前对话暂无文件<br><small>Agent 生成的文件会自动展示在这里</small></div>';
        }
        _updateApCount();
      }

      function refreshFileTree() {
        if (!conversationId) {
          clearFileTree();
          return;
        }

        fetch(
          `${baseUrl()}/py/api/conversations/${conversationId}/files/tree`,
          { headers: headers() },
        )
          .then((r) => {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then((data) => {
            _renderFileTree(data.roots || []);
          })
          .catch(() => {
            // Silently ignore — file tree is non-critical
          });
      }

      function clearFileTree() {
        _fileTreeRoots = [];
        $('apList').innerHTML =
          '<div class="ap-empty">Agent 生成的文件<br>会自动展示在这里</div>';
        _updateApCount();
      }

      function _updateApCount() {
        let total = 0;
        _fileTreeRoots.forEach((r) => {
          total += _countTreeFiles(r);
        });
        $('apCount').textContent = total;
      }

      function downloadArtifact(virtualPath) {
        if (!conversationId) return;
        _currentFile.path = virtualPath;
        _currentFile.blobUrl = '';
        downloadCurrentFile();
      }

      // ═══════════════════════ AUTH VERIFY ═══════════════════════
      async function verifyAndInit() {
        // 1. 优先从 URL query 参数中提取 token 并存入 localStorage
        const params = new URLSearchParams(window.location.search);
        const urlToken = params.get('token');
        if (urlToken) {
          setToken(urlToken);
          // 清除 URL 中的 token 参数（安全）
          if (window.history.replaceState) {
            const cleanUrl = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanUrl);
          }
        }

        // 2. 同步 token 输入框（从 localStorage 读取）
        $('token').value = getToken();

        const t = token();
        console.log(
          'verifyAndInit: token =',
          t ? t.substring(0, 20) + '...' : '(empty)',
        );
        $('authStatus').className = 'status-dot idle';
        $('authText').textContent = '验证中...';

        if (!t) {
          $('authStatus').className = 'status-dot err';
          $('authText').textContent = '未设置 Token';
          finishInit();
          return;
        }

        // 3. 调用 verify 接口校验并注册
        try {
          const r = await fetch(`${baseUrl()}/py/api/auth/verify`, {
            method: 'POST',
            headers: headers(),
          });
          if (!r.ok) {
            const err = await r.text();
            throw new Error(`${r.status}: ${err}`);
          }
          const data = await r.json();
          currentRole = data.role || 'user';
          console.log('Auth verify OK:', data);
          $('authStatus').className = 'status-dot ok';
          $('authText').textContent =
            `已鉴权 · ${data.user_id.substring(0, 12)}...${data.is_new_user ? ' (新注册)' : ''}`;
        } catch (e) {
          $('authStatus').className = 'status-dot err';
          $('authText').textContent = e.message;
        }

        finishInit();
      }

      function finishInit() {
        // ── Base URL 初始化 ──────────────────────────────────────────────────
        // 检查 localStorage 是否有用户手动保存的 URL，没有则用环境默认值
        const savedUrl = localStorage.getItem('skillhub_baseUrl');
        if (savedUrl) {
          $('baseUrl').value = savedUrl;
        } else {
          $('baseUrl').value = getDefaultBaseUrl();
        }
        // 更新环境标签
        updateEnvBadge();
        // 监听用户手动修改，自动保存
        $('baseUrl').addEventListener('input', () => {
          localStorage.setItem('skillhub_baseUrl', $('baseUrl').value.trim());
          updateEnvBadge();
        });

        // Page refresh / new tab always starts fresh — we intentionally do
        // NOT restore conversationId from storage.  The user must explicitly
        // click a conversation in the sidebar to select it.  This prevents
        // debug quick-send from accidentally routing messages into a
        // historical conversation.
        checkHealth();
        loadConversations();
        fetchModels();
        renderThinkingToggle();

        $('userInput').addEventListener('input', () => {
          autoResizeTextarea();
          updateSendBtn();
        });
        updateSendBtn();
      }

      function updateEnvBadge() {
        const badge = $('envBadge');
        const url = baseUrl();
        if (!url) {
          badge.textContent = '...';
          badge.style.background = 'var(--surface2)';
          badge.style.color = 'var(--text2)';
          return;
        }
        try {
          const u = new URL(url);
          if (u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '[::1]') {
            badge.textContent = '本地';
            badge.style.background = 'rgba(250,204,21,0.2)';
            badge.style.color = 'var(--yellow)';
          } else {
            badge.textContent = '线上';
            badge.style.background = 'rgba(74,222,128,0.2)';
            badge.style.color = 'var(--green)';
          }
        } catch {
          badge.textContent = '?';
          badge.style.background = 'var(--surface2)';
          badge.style.color = 'var(--text2)';
        }
      }

      // ── Start ──
      verifyAndInit();
    </script>
  </body>
</html>
